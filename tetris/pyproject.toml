[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["gymnasium>=1.0", "numpy>=1.24", "pygame>=2.5", "torch>=2.0", "tensorboard>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
